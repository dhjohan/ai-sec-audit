rules:
  - id: python-eval-usage
    languages: [python]
    message: Avoid eval() on untrusted input (OWASP A05:2025 Injection).
    severity: WARNING
    metadata:
      owasp: ["A05:2025 - Injection"]
      cwe: ["CWE-95"]
    pattern: eval(...)

  - id: python-sql-string-build
    languages: [python]
    message: SQL built with string concatenation/formatting enables injection.
    severity: ERROR
    metadata:
      owasp: ["A05:2025 - Injection"]
      cwe: ["CWE-89"]
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...")
          - pattern: $CUR.execute("..." + ...)
          - pattern: $CUR.execute("..." % ...)
          - pattern: $CUR.execute("...".format(...))

  - id: python-hardcoded-secret
    languages: [python]
    message: Hardcoded credential or secret literal.
    severity: WARNING
    metadata:
      owasp: ["A04:2025 - Cryptographic Failures"]
      cwe: ["CWE-798"]
    patterns:
      - pattern: $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(password|passwd|secret|token|api_key|apikey)
