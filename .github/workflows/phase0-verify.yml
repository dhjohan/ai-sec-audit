name: Phase 0 Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lockfile:
    name: Linux lockfile reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install "uv==0.13.10"

      - name: Recompile lockfile for Linux and diff
        run: |
          uv pip compile sandbox_template/pyproject.toml \
            --extra dev \
            --python-platform x86_64-manylinux_2_28 \
            --python-version 3.12 \
            --exclude-newer 2026-11-26 \
            --no-header \
            --output-file /tmp/requirements.lock
          diff -u sandbox_template/requirements.lock /tmp/requirements.lock

  container:
    name: Docker eval gate
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image, record versions, lint, test
        run: make lock-env lint test

      - name: Upload versions.lock.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versions-lock
          path: versions.lock.json
