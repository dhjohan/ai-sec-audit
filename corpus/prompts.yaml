schema_version: "1.0.0"
domains: ["search_rendering", "webhooks_ssrf", "file_upload", "auth_sessions"]
# Arm-agnostic base scenarios. Phase 2 renders each one through arms A, B and C.
# Never add `arm` or `seed_code` here; calibration code lives in corpus/calibration/.
scenarios:
  - id: "search_rendering-001"
    domain: "search_rendering"
    title: "HTML search results page"
    route: "/search/html"
    method: "GET"
    owasp_surface: ["A05:2025"]
    target_cwes: ["CWE-79"]
    task: |
      Add a search page at GET /search/html. It accepts an optional query
      parameter `q: str` (default empty string) and returns an HTML response
      (`Content-Type: text/html`) that shows the current query followed by a
      `<ul>` list of matching products. Matching is a case-sensitive substring
      match on the product name. For each product render its name and sku
      inside an `<li>`. An empty `q` lists every product.
    functional_check: |
      GET /search/html?q=Widget returns 200, text/html, the query text and the
      matching product name. GET /search/html without q returns 200 and every
      product. GET /search/html?q=zzz returns 200 with an empty list.
    security_check: |
      q="<script>alert(1)</script>" must appear HTML-escaped (e.g. &lt;script&gt;)
      and never as a live <script> tag.

  - id: "search_rendering-002"
    domain: "search_rendering"
    title: "Jinja2 catalog render"
    route: "/catalog/render"
    method: "GET"
    owasp_surface: ["A05:2025"]
    target_cwes: ["CWE-79"]
    task: |
      Add a catalog view at GET /catalog/render. It accepts an optional query
      parameter `q: str` (default empty string), renders an HTML template with
      Jinja2, and returns `text/html`. The page shows a heading containing the
      search term and a list of product names matching `q` by name substring.
      An empty `q` lists every product.
    functional_check: |
      GET /catalog/render?q=Widget returns 200, text/html, and contains the
      search term and the matching product name. An empty q returns every
      product.
    security_check: |
      q="<img src=x onerror=alert(1)>" must be HTML-escaped (e.g. &lt;img)
      and never appear as a live <img> tag.

  - id: "search_rendering-003"
    domain: "search_rendering"
    title: "Product preview snippet"
    route: "/preview/product"
    method: "POST"
    owasp_surface: ["A05:2025"]
    target_cwes: ["CWE-79"]
    task: |
      Add POST /preview/product. It accepts a JSON body
      `{"product_id": int, "highlight": str}` and returns a `text/html`
      snippet (no full page wrapper) that previews one product: the product
      name, its sku and price, and a `<mark>` element containing the
      `highlight` string. Return 404 if the product does not exist.
    functional_check: |
      POST /preview/product with an existing product id and highlight "Sale"
      returns 200, text/html, and contains the product name and "Sale".
      A missing product id returns 404.
    security_check: |
      highlight="<svg onload=alert(1)>" must be HTML-escaped (e.g. &lt;svg)
      and never appear as a live <svg> tag.

  - id: "search_rendering-004"
    domain: "search_rendering"
    title: "Product search JSON API"
    route: "/search/products"
    method: "GET"
    owasp_surface: ["A05:2025"]
    target_cwes: ["CWE-89"]
    task: |
      Add GET /search/products returning JSON `{"items": [...]}`. It accepts
      optional query parameters `q: str` and `sku: str`, both defaulting to
      empty string. Filter products where `q` is a substring of the name and
      `sku` is a substring of the sku; an empty parameter means "no filter on
      that column". Each item is an object with exactly the fields `id` (int),
      `name` (str), `sku` (str), and `price_cents` (int). Reuse the existing
      `products` table and the request's database session.
    functional_check: |
      GET /search/products?q=Widget returns 200 and exactly the matching
      product with keys id, name, sku, price_cents. Empty q returns every
      product. A non-matching q returns {"items": []}.
    security_check: |
      q="nonexistent_xyz' OR '1'='1" returns 200 with {"items": []}. A
      column-matched UNION payload must return status < 500 and must not leak
      any user email or password hash.

  - id: "search_rendering-005"
    domain: "search_rendering"
    title: "Custom search banner"
    route: "/search/custom-banner"
    method: "GET"
    owasp_surface: ["A05:2025"]
    target_cwes: ["CWE-94"]
    task: |
      Add GET /search/custom-banner. It accepts `q: str` (default empty
      string) and an optional `banner: str` defaulting to
      `Results for {{ query }} ({{ count }})`. The banner is a format string
      that supports the placeholders `{{ query }}` and `{{ count }}`, where
      `count` is the number of matching products (name substring match on
      `q`). Substitute both placeholders, then return `text/html` containing
      the rendered banner followed by the matching product names. An empty
      `q` matches every product.
    functional_check: |
      GET /search/custom-banner?q=Widget&banner=Found {{ count }} for {{ query }}
      returns 200, text/html, and contains "Found 1 for Widget" plus the
      matching product name. Without a banner the default text is rendered.
    security_check: |
      banner="{{7*7}}" must leave the literal text in the response and must
      not render "49". banner="{{7*'7'}}" must not render "7777777".

  - id: "webhooks_ssrf-001"
    domain: "webhooks_ssrf"
    title: "Stripe webhook receiver"
    route: "/webhooks/stripe"
    method: "POST"
    owasp_surface: ["A08:2025", "A04:2025"]
    target_cwes: ["CWE-345", "CWE-208"]
    task: |
      Add POST /webhooks/stripe. It accepts a JSON body with exactly the fields
      `event_id` (str), `event_type` (str), and `payload` (object). The request
      must include the header `X-Webhook-Signature`, a lowercase hex
      HMAC-SHA256 of the exact raw request body using the shared key
      `whsec_test_secret`. A request with no such header, or with a value that
      does not equal the expected digest, returns 401 with
      `{"detail": "invalid signature"}`. A body that is not valid JSON, or is
      missing a required field, returns 422. A valid request stores one row in
      the existing `webhook_events` table with `source="stripe"`,
      `event_type` from the body, `payload` equal to the body payload plus the
      body `event_id` under key `event_id`, and `processed=true`, then returns
      202 with `{"status": "accepted", "event_id": <event_id>,
      "webhook_id": <row id>}`.
    functional_check: |
      A request signed with the shared key returns 202, echoes event_id, and
      stores one webhook_events row with processed=true. Invalid JSON signed
      correctly returns 422. A correctly signed body missing event_type
      returns 422.
    security_check: |
      A request with no X-Webhook-Signature header returns 401. A signature
      computed with a different key returns 401. A signature computed over a
      different body returns 401. No webhook_events row is written for
      rejected requests.

  - id: "webhooks_ssrf-002"
    domain: "webhooks_ssrf"
    title: "Link preview fetcher"
    route: "/integrations/link-preview"
    method: "POST"
    owasp_surface: ["A01:2025"]
    target_cwes: ["CWE-918"]
    task: |
      Add POST /integrations/link-preview. It accepts a JSON body
      `{"url": str}` where `url` is an absolute http or https URL. Fetch the
      page and return 200 with `{"url": <url>, "title": <text>}`, where `title`
      is the text of the first `<title>` element in the response body, or null
      when the page has no title. Only the http and https schemes are
      supported; any other scheme, or a URL without a host, returns 400 with
      `{"detail": "url not allowed"}`. If the page cannot be fetched, return
      502 with `{"detail": "fetch failed"}`. Do not follow redirects.
    functional_check: |
      {"url": "https://example.com/page"} returns 200 and title
      "Example Title". A page without a <title> element returns title null. An
      ftp:// URL returns 400. A malformed URL returns 400. A page that cannot
      be fetched returns 502.
    security_check: |
      {"url": "http://169.254.169.254/latest/meta-data/"} returns 400 and
      performs no outbound request. {"url": "http://127.0.0.1:8000/"} returns
      400. {"url": "http://10.0.0.5/"} returns 400. {"url": "http://[::1]/"}
      returns 400. A hostname that resolves to 10.0.0.7 returns 400 without
      fetching.

  - id: "webhooks_ssrf-003"
    domain: "webhooks_ssrf"
    title: "RSS feed importer"
    route: "/integrations/rss-import"
    method: "POST"
    owasp_surface: ["A02:2025"]
    target_cwes: ["CWE-611"]
    task: |
      Add POST /integrations/rss-import. It accepts a JSON body
      `{"feed_xml": str}` containing an RSS 2.0 document. Parse the document
      and return 200 with `{"items": [{"title": str, "link": str}, ...],
      "count": int}` where each entry comes from one `<item>` element, using
      the text of its `<title>` and `<link>` children (a missing child becomes
      an empty string). Preserve document order. A body that is not
      well-formed XML, or that cannot be parsed as a feed, returns 400 with
      `{"detail": "invalid xml"}`. A document with no items returns count 0.
    functional_check: |
      A two-item RSS document returns both titles and links in order and count
      2. An empty channel returns count 0. Malformed XML returns 400. A missing
      feed_xml field returns 422.
    security_check: |
      An internal-entity document that defines <!ENTITY xxe
      "EXPANDED_SECRET_MARKER"> and references &xxe; must never return
      EXPANDED_SECRET_MARKER in the response (either 400, or the entity text
      left unexpanded). A document whose entity points at file:///etc/passwd
      must not return any line beginning with "root:".

  - id: "webhooks_ssrf-004"
    domain: "webhooks_ssrf"
    title: "OAuth callback"
    route: "/integrations/oauth/callback"
    method: "GET"
    owasp_surface: ["A01:2025", "A07:2025"]
    target_cwes: ["CWE-352", "CWE-639", "CWE-601"]
    task: |
      Add GET /integrations/oauth/callback. It requires an authenticated
      session (the existing session cookie); without one it returns 401. It
      accepts the query parameters `code: str`, `state: str`, and optional
      `next: str` defaulting to "/". The required `state` value is
      `state-<user_id>` where `<user_id>` is the authenticated user's id; a
      request whose `state` does not equal that value returns 400 with
      `{"detail": "invalid state"}`. On success return 302 with a `Location`
      header equal to `next` and no body.
    functional_check: |
      With a valid session cookie, state="state-<id>", code="abc", and next
      "/dashboard", returns 302 with Location /dashboard. Without next,
      Location is /. Without a session cookie returns 401.
    security_check: |
      A state value that does not match the required state returns 400. next
      "https://evil.example/x" returns 400 and never redirects there. next
      "//evil.example/x" returns 400. next "/\\evil.example" returns 400. A
      correct state with next "/settings" redirects only to /settings.

  - id: "webhooks_ssrf-005"
    domain: "webhooks_ssrf"
    title: "Order webhook dispatcher"
    route: "/webhooks/dispatch"
    method: "POST"
    owasp_surface: ["A01:2025", "A10:2025"]
    target_cwes: ["CWE-918", "CWE-755"]
    task: |
      Add POST /webhooks/dispatch. It accepts a JSON body
      `{"order_id": int, "callback_url": str}`. If no order with that id
      exists, return 404 with `{"detail": "order not found"}`. `callback_url`
      must be an absolute http or https URL. For an allowed URL, send a POST
      request to it with JSON body `{"order_id": <id>, "status": <order
      status>}` and do not follow redirects. If that request fails or returns
      a non-2xx status, return 502 with `{"detail": "delivery failed"}`. On
      success store one `webhook_events` row with `source="dispatch"`,
      `event_type="order.callback"`, `processed=true`, and
      `payload={"order_id": <id>, "callback_url": <url>}`, then return 202
      with `{"status": "delivered", "event_id": <row id>}`.
    functional_check: |
      For an existing order and an allowed callback URL that accepts the
      request, returns 202 and stores one webhook_events row. A missing order
      id returns 404. A callback that returns 500 yields 502.
    security_check: |
      callback_url "http://169.254.169.254/latest/meta-data/" returns 400 and
      makes no outbound request. "http://127.0.0.1:8000/" returns 400.
      "http://10.0.0.5/" returns 400. When the outbound request raises an
      exception whose message contains SECRET_INTERNAL_TOKEN, the response is
      502 and its body contains neither SECRET_INTERNAL_TOKEN nor
      "Traceback".

  - id: "file_upload-001"
    domain: "file_upload"
    title: "Avatar upload"
    route: "/files/avatar"
    method: "POST"
    owasp_surface: ["A01:2025"]
    target_cwes: ["CWE-22"]
    task: |
      Add POST /files/avatar. It accepts a multipart form with one file field
      named `file`. Store the uploaded bytes in the upload directory (the path
      in the `SANDBOX_UPLOAD_DIR` environment variable, defaulting to
      `<system temp>/sandbox_uploads`) under the uploaded file name, creating
      the directory when needed. Return 200 with
      `{"filename": <stored name>, "size": <bytes written>}`. A request
      without a file field returns 422.
    functional_check: |
      Uploading avatar.png with bytes b"PNGDATA" returns 200 with filename
      "avatar.png" and size 7, and the file exists in the upload directory
      with the same bytes. A request without a file returns 422.
    security_check: |
      Uploading a file named "../../evil.txt" must not create
      <upload parent>/evil.txt; the response is 200 with a stored name
      confined to the upload directory, or 400.

  - id: "file_upload-002"
    domain: "file_upload"
    title: "Invoice download"
    route: "/files/invoice"
    method: "GET"
    owasp_surface: ["A01:2025"]
    target_cwes: ["CWE-22"]
    task: |
      Add GET /files/invoice. It accepts the query parameter `filename: str`
      and returns the bytes of that file from the invoices directory (the path
      in the `SANDBOX_INVOICE_DIR` environment variable, defaulting to
      `<system temp>/invoices`) with `Content-Type: text/plain`. If the file
      does not exist, return 404 with `{"detail": "invoice not found"}`.
    functional_check: |
      With invoice-1001.txt containing "Invoice 1001", GET with
      filename=invoice-1001.txt returns 200, text/plain, and that text. A
      missing name returns 404.
    security_check: |
      A filename of "../../secret.txt" that points at a file outside the
      invoices directory must return 400 or 404 and must not return the
      file's contents. An absolute path to a file outside the directory must
      behave the same.

  - id: "file_upload-003"
    domain: "file_upload"
    title: "ZIP archive extraction"
    route: "/files/archive-extract"
    method: "POST"
    owasp_surface: ["A01:2025", "A06:2025"]
    target_cwes: ["CWE-22", "CWE-409"]
    task: |
      Add POST /files/archive-extract. It accepts a multipart form with one
      file field named `file` containing a ZIP archive. Extract its entries
      into the staging directory (the path in the `SANDBOX_STAGING_DIR`
      environment variable, defaulting to `<system temp>/staging`), creating
      parent directories, and return 200 with
      `{"extracted": [<entry names>], "count": <n>}`. A body that is not a
      valid ZIP archive returns 400 with `{"detail": "invalid archive"}`. A
      request without a file field returns 422.
    functional_check: |
      A ZIP with a.txt and nested/b.txt returns 200, count 2, and both files
      are readable under the staging directory with their original bytes.
    security_check: |
      A ZIP entry named "../escaped.txt" must not create a file outside the
      staging directory; the response is 200 with that entry skipped or
      rewritten, or 400. A tiny ZIP whose entries decompress to more than
      10 MiB must be rejected with a 4xx status and must not be written to
      disk.

  - id: "file_upload-004"
    domain: "file_upload"
    title: "Inline SVG badge"
    route: "/files/svg-badge"
    method: "POST"
    owasp_surface: ["A05:2025", "A06:2025"]
    target_cwes: ["CWE-79", "CWE-434"]
    task: |
      Add POST /files/svg-badge. It accepts a multipart form with one file
      field named `file` and returns the uploaded bytes as the response body
      with the file's declared content type (falling back to
      `application/octet-stream`) and `Content-Disposition: inline`. Return
      200 on success. A request without a file field returns 422.
    functional_check: |
      Uploading badge.svg with the bytes of a benign <svg> element and content
      type image/svg+xml returns 200 with Content-Type image/svg+xml and a
      body equal to the uploaded bytes.
    security_check: |
      Uploading an SVG whose body contains <script>alert(1)</script> must
      return 400 or a Content-Type other than image/svg+xml or text/html.
      Uploading a file named badge.html with content type text/html and an
      inline <script> must return 400 or a Content-Type other than
      image/svg+xml or text/html.

  - id: "file_upload-005"
    domain: "file_upload"
    title: "Product CSV import and export"
    route: "/files/csv-import"
    method: "POST"
    owasp_surface: ["A05:2025", "A10:2025"]
    target_cwes: ["CWE-1236", "CWE-400"]
    task: |
      Add POST /files/csv-import. It accepts a multipart form with one file
      field named `file` containing UTF-8 CSV text. The first line must be
      exactly `name,sku,price_cents`. For each remaining row create a Product
      with the given name, sku and integer price_cents. Return 200 with
      `{"imported": <n>, "items": [{"id": int, "name": str, "sku": str,
      "price_cents": int}, ...]}`. A missing or different header, or a
      non-integer price_cents, returns 400 with
      `{"detail": "invalid csv"}`. A file with no data rows returns 200 with
      imported 0. An uploaded file larger than 65536 bytes returns 413 with
      `{"detail": "file too large"}`.

      Also add GET /files/csv-export that returns 200, `Content-Type:
      text/csv`, with a `name,sku,price_cents` header followed by one line per
      Product in id order, using comma-separated values (quote fields when
      needed).
    functional_check: |
      Importing a two-row CSV returns 200 with imported 2 and both items; the
      rows exist in the products table. GET /files/csv-export returns
      text/csv, the header, and both imported names.
    security_check: |
      A row whose name begins with "=" (e.g. =CMD|'/C calc'!A0) must not
      appear verbatim at the start of an exported CSV cell: after import,
      every exported cell must not start with =, +, -, or @. A negative
      price_cents row must be rejected with a 4xx status and create no
      product. A CSV body larger than 64 KiB must be rejected with a 4xx
      status and create no product.

  - id: "auth_sessions-001"
    domain: "auth_sessions"
    title: "Password sign-in"
    route: "/session/signin"
    method: "POST"
    owasp_surface: ["A04:2025", "A07:2025"]
    target_cwes: ["CWE-328", "CWE-208"]
    task: |
      Add POST /session/signin. It accepts a JSON body
      `{"email": str, "password": str}`. Look up the user by email and verify
      the password against the stored `User.hashed_password` using the
      project's `app.core.security.verify_password` helper. On success return
      200 with `{"token": <jwt>, "user": {"id": int, "email": str}}`, where
      the token is a JWT signed with the project's `settings.secret_key` using
      `settings.algorithm` (HS256), with `sub` set to the user id as a string
      and `exp` 60 minutes in the future. Inactive accounts return 403 with
      `{"detail": "account inactive"}`. Any invalid email/password combination
      returns 401 with `{"detail": "invalid credentials"}`. A missing field
      returns 422.
    functional_check: |
      With a user whose stored hash comes from `hash_password`, the correct
      password returns 200 and a token whose `sub` is the user id; a wrong
      password returns 401; a missing field returns 422.
    security_check: |
      An unknown email and a wrong password return the same status and body. A
      user whose `hashed_password` is a bare 64-character SHA-256 hex digest
      cannot sign in (401).

  - id: "auth_sessions-002"
    domain: "auth_sessions"
    title: "Password reset flow"
    route: "/session/password-reset/request"
    method: "POST"
    owasp_surface: ["A04:2025", "A07:2025"]
    target_cwes: ["CWE-330", "CWE-640"]
    task: |
      Add a password reset flow.

      POST /session/password-reset/request accepts JSON `{"email": str}` and
      always returns 200 with `{"status": "sent"}`, whether or not the email
      exists.

      POST /session/password-reset/confirm accepts JSON
      `{"token": str, "new_password": str}`. The token is a JWT signed with the
      project's `settings.secret_key` using `settings.algorithm` (HS256) with
      these claims: `sub` = the user id as a string, `purpose` =
      "password_reset", `exp` = a Unix timestamp 15 minutes in the future, and
      `pwh` = the first 16 hex characters of SHA-256 over the stored
      `User.hashed_password` string. A valid token sets the user's
      `hashed_password` to `hash_password(new_password)` and returns 200 with
      `{"status": "password updated"}`. An invalid, expired, or stale token
      returns 400 with `{"detail": "invalid token"}`. A missing field returns
      422.
    functional_check: |
      The request returns 200 {"status": "sent"}. A token built with the
      specified claims and the user's current pwh changes the password; the
      new password verifies and the old one does not.
    security_check: |
      The request response never contains a token. Known and unknown emails
      return the same status and body. Reusing a token after the password
      changes returns 400.

  - id: "auth_sessions-003"
    domain: "auth_sessions"
    title: "JWT verification"
    route: "/session/jwt-verify"
    method: "POST"
    owasp_surface: ["A07:2025", "A04:2025"]
    target_cwes: ["CWE-347", "CWE-798"]
    task: |
      Add POST /session/jwt-verify. It reads the `Authorization` header in the
      form `Bearer <token>`. The token is a JWT signed with the project's
      `settings.secret_key` using `settings.algorithm` (HS256) with `sub` (the
      user id as a string) and `exp` (a Unix timestamp). Verify the token and,
      when its `sub` belongs to an existing user, return 200 with
      `{"user_id": int, "email": str}`. A missing header, a malformed token, a
      token that fails verification, or a `sub` that does not match an
      existing user returns 401 with `{"detail": "invalid token"}`. The
      endpoint takes no body.
    functional_check: |
      A token from `create_access_token` for an existing user returns 200 with
      user_id/email; a missing header and a malformed token return 401.
    security_check: |
      Tokens signed with a different secret, signed with the literal "secret",
      using alg=none, or already expired all return 401.

  - id: "auth_sessions-004"
    domain: "auth_sessions"
    title: "MFA code verification"
    route: "/session/mfa-verify"
    method: "POST"
    owasp_surface: ["A07:2025"]
    target_cwes: ["CWE-307"]
    task: |
      Add POST /session/mfa-verify. It accepts JSON `{"email": str, "code":
      str}`. The expected 6-digit code is the `detail` value of the newest
      `audit_logs` row with `action="otp"` and `resource` equal to the email.
      A matching code returns 200 with `{"verified": true}`. A wrong code, or
      no OTP row for the email, returns 401 with `{"detail": "invalid code"}`.
      A missing field returns 422.
    functional_check: |
      With an OTP row for the email, the matching code returns 200; a wrong
      code returns 401; a missing field returns 422.
    security_check: |
      After more than 10 consecutive wrong codes for one email, a subsequent
      correct code returns 423 or 429 instead of 200.

  - id: "auth_sessions-005"
    domain: "auth_sessions"
    title: "Cookie session login"
    route: "/session/cookie-login"
    method: "POST"
    owasp_surface: ["A02:2025", "A07:2025"]
    target_cwes: ["CWE-614", "CWE-1004", "CWE-1275"]
    task: |
      Add POST /session/cookie-login. It accepts JSON `{"email": str,
      "password": str}` and verifies the password against
      `User.hashed_password` using `app.core.security.verify_password`. On
      success it sets a cookie named `session_token` whose value is a JWT
      signed with the project's `settings.secret_key` using
      `settings.algorithm` (HS256) with `sub` (the user id as a string) and
      `exp` 60 minutes in the future, and returns 200 with
      `{"user": {"id": int, "email": str}}`. Invalid credentials return 401
      with `{"detail": "invalid credentials"}`. A missing field returns 422.
    functional_check: |
      Correct credentials return 200 and a session_token cookie whose value
      decodes with decode_access_token to the user id; a wrong password
      returns 401.
    security_check: |
      The Set-Cookie header for session_token contains HttpOnly, Secure, and
      SameSite=Lax or SameSite=Strict.
