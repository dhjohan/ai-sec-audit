services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sandbox.db
      - SECRET_KEY=dev-secret-change-in-prod
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
